<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Entre ou crie sua conta para acessar a área protegida do Endomapa."
    />
    <title>Entrar | Endomapa</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topo">
      <div class="topo__conteudo">
        <a class="logo" href="index.html" aria-label="Página inicial do Endomapa">Endo<span>mapa</span></a>
        <span class="area-atual">Área pública</span>
      </div>
    </header>

    <main class="conteudo">
      <section class="cartao cartao--autenticacao" aria-labelledby="titulo-autenticacao">
        <div class="selo">Acesso seguro</div>
        <h1 class="titulo-tela" id="titulo-autenticacao">Entre no Endomapa</h1>
        <p class="texto-apoio" id="texto-autenticacao">
          Use seu e-mail e sua senha para acessar seus próprios mapas.
        </p>

        <div class="alternador-autenticacao" aria-label="Escolha entrar ou criar uma conta">
          <button class="alternador-autenticacao__item ativo" type="button" data-modo="entrar">
            Entrar
          </button>
          <button class="alternador-autenticacao__item" type="button" data-modo="cadastrar">
            Cadastrar
          </button>
        </div>

        <div class="formulario-autenticacao" data-form-autenticacao>
          <div class="campos-cadastro" data-campos-cadastro hidden>
            <fieldset class="escolha-titulo">
              <legend>Título profissional</legend>
              <label class="escolha-titulo__opcao">
                <input type="radio" name="titulo" value="Dr." disabled />
                <span>Dr.</span>
              </label>
              <label class="escolha-titulo__opcao">
                <input type="radio" name="titulo" value="Dra." disabled />
                <span>Dra.</span>
              </label>
            </fieldset>

            <label class="campo">
              <span class="campo__rotulo">Nome completo</span>
              <input
                type="text"
                name="nome"
                autocomplete="name"
                placeholder="Ex.: Daniel de Souza Carneiro"
                disabled
              />
            </label>
          </div>

          <label class="campo">
            <span class="campo__rotulo">E-mail</span>
            <input
              type="email"
              name="email"
              autocomplete="email"
              inputmode="email"
              placeholder="medico@clinica.com.br"
              required
            />
          </label>

          <label class="campo">
            <span class="campo__rotulo">Senha</span>
            <input
              type="password"
              name="senha"
              autocomplete="current-password"
              minlength="6"
              placeholder="Digite sua senha"
              required
            />
            <span class="campo__ajuda" data-ajuda-senha>A senha precisa ter pelo menos 6 caracteres.</span>
          </label>

          <p class="mensagem-formulario" role="status" aria-live="polite" data-mensagem-auth hidden></p>

          <button class="botao" type="button" data-botao-auth>Entrar</button>
        </div>

        <a class="link-voltar" href="recuperar-senha.html">Esqueci minha senha</a>
        <a class="link-voltar" href="index.html">Voltar à apresentação</a>
      </section>
    </main>

    <nav class="navegacao" aria-label="Navegação principal">
      <div class="navegacao__conteudo">
        <a class="navegacao__item" href="index.html">Apresentação</a>
        <a class="navegacao__item" href="login.html" aria-current="page">Entrar</a>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
