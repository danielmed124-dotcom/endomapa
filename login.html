<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Acesso demonstrativo ao protótipo navegável do Endomapa."
    />
    <title>Entrar | Endomapa</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topo">
      <div class="topo__conteudo">
        <a class="logo" href="index.html" aria-label="Página inicial do Endomapa">Endo<span>mapa</span></a>
        <span class="area-atual">Área pública</span>
      </div>
    </header>

    <main class="conteudo">
      <section class="cartao" aria-labelledby="titulo">
        <div class="selo">Acesso demonstrativo</div>
        <h1 class="titulo-tela" id="titulo">Entre no protótipo</h1>
        <p class="texto-apoio">
          Hoje você pode passear pela aparência do Endomapa sem criar uma conta. O login verdadeiro será
          conectado ao Supabase em uma etapa futura.
        </p>

        <div class="acoes">
          <a class="botao" href="app.html">Entrar no protótipo</a>
          <a class="link-voltar" href="index.html">Voltar à apresentação</a>
        </div>
      </section>
    </main>

    <nav class="navegacao" aria-label="Navegação principal">
      <div class="navegacao__conteudo">
        <a class="navegacao__item" href="index.html" aria-current="page">Área pública</a>
        <button
          class="navegacao__item"
          type="button"
          data-mensagem="A área protegida de demonstração será adicionada nas próximas telas."
        >
          Área protegida
        </button>
      </div>
    </nav>

    <p class="aviso" role="status" aria-live="polite" data-aviso hidden></p>
    <script src="prototipo.js"></script>
  </body>
</html>
