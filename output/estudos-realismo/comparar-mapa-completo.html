<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comparação do mapa completo | Endomapa</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #151b16; color: #f5f1e8; font: 16px/1.5 Arial, sans-serif; }
    main { max-width: 1250px; margin: auto; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 8px; }
    p { max-width: 78ch; }
    .grade { display: grid; gap: 16px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #6f7f66; border-radius: 12px; background: white; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px; color: #f5f1e8; background: #263027; font-weight: bold; }
    a { color: #edca76; }
    @media (min-width: 760px) { .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>Mapa completo: original e estudo realista</h1>
    <p>Esta é uma proposta visual. Confira quantidade, tipo, lado, posição, tamanho e separação dos achados antes de qualquer uso clínico. Toque na imagem para abri-la em tamanho completo.</p>
    <div class="grade">
      <figure>
        <a href="mapa-base-estudo-original.jpg"><img src="mapa-base-estudo-original.jpg" alt="Mapa original completo com as lesões" /></a>
        <figcaption>Montagem original</figcaption>
      </figure>
      <figure>
        <a href="mapa-realista-completo-estudo-v1.png"><img src="mapa-realista-completo-estudo-v1.png" alt="Estudo do mapa completo com as lesões redesenhadas e integradas" /></a>
        <figcaption>Estudo realista do mapa completo · revisão médica necessária</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
