<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste local — SOMP esquerdo</title>
<style>body{margin:0;font:16px Arial;background:#f5f5f1}header{padding:12px 20px}iframe{display:block;width:390px;max-width:100%;height:90vh;border:0;margin:auto}pre{white-space:pre-wrap}button{padding:10px}</style>
<header><strong>Endomapa — teste local de SOMP esquerdo</strong><p>Arraste o conjunto no mapa e experimente os ajustes. Este teste não salva exames na sua conta.</p><button id="largura">Alternar celular / computador</button><pre id="resultado">Preparando o editor…</pre></header>
<iframe title="Editor local do Endomapa"></iframe>
<script>
(async () => {
 const status = document.querySelector('#resultado'), quadro = document.querySelector('iframe');
 const verificar = (ok, mensagem) => { if (!ok) throw new Error(mensagem); };
 document.querySelector('#largura').onclick = () => { quadro.style.width = quadro.style.width === '100%' ? '390px' : '100%'; };
 try {
  const html = await (await fetch('../app.html')).text();
  const doc = new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,base').forEach(e => e.remove());
  doc.body.classList.remove('autenticacao-pendente');
  const base = doc.createElement('base'); base.href = new URL('../',location.href).href; doc.head.prepend(base);
  const ambiente = doc.createElement('script');
  ambiente.textContent = "history.replaceState = function() {};";
  doc.head.append(ambiente);
  ['prototipo.js','assets/vendor/jspdf-4.2.1.umd.min.js','pdf-manual.js','editor-documento.js','editor-manual.js'].forEach(src => {
   const script=doc.createElement('script'); script.src=src; doc.body.append(script);
  });
  const pronto = new Promise(resolve => quadro.onload=resolve);
  quadro.srcdoc='<!doctype html>'+doc.documentElement.outerHTML; await pronto;
  const w=quadro.contentWindow, d=w.document;
  d.querySelector('[data-tela-alvo="editor-manual"]').click();
  d.querySelector('[data-modelo][data-nome="SOMP esquerdo"]').click();
  const lesao=d.querySelector('[data-camada-editor="coronal"] .lesao-editavel');
  verificar(lesao, 'Conjunto não foi inserido no coronal');
  await lesao.querySelector('img').decode();
  verificar(lesao.querySelector('img').naturalWidth===1144,'Imagem de alta resolução não carregou');
  verificar(Math.abs(Number(lesao.dataset.x)-29.97237569)<0.001,'Posição horizontal incorreta');
  verificar(Math.abs(Number(lesao.dataset.y)-48.89502762)<0.001,'Posição vertical incorreta');
  const camada=lesao.parentElement.getBoundingClientRect(), area=lesao.getBoundingClientRect();
  verificar(Math.abs(area.width/camada.width-0.13*0.95)<0.002,'Escala inicial incorreta');
  verificar(Math.abs(area.width/area.height-143/192)<0.01,'Proporção do conjunto incorreta');
  verificar(d.documentElement.scrollWidth<=quadro.clientWidth+2,'Transbordamento horizontal no celular');
  const montagem=w.endomapaEditorManual.capturar();
  w.endomapaEditorManual.validar(montagem);
  const captura=await w.endomapaCapturarMapaManual({formato:'image/png',semRotulos:true});
  verificar(Boolean(captura),'Captura do mapa falhou');
  status.textContent='PASSOU: imagem, posição, proporção, celular, validação da montagem e captura PNG. Pronto para testar.';
  if(new URLSearchParams(location.search).has('visual')) quadro.style.width='100%';
 } catch(erro) { status.textContent='FALHOU: '+erro.message; }
})();
</script>
</html>
