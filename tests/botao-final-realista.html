<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'self'">
<title>Teste do mapa final com Gemini, sem chamadas reais</title>
<div id="cenario">
  <button data-gerar-realista="gpt" disabled></button>
  <button data-gerar-regioes>Montar grátis</button>
  <button data-gerar-final-realista>Gerar final</button>
  <div class="editor-manual__area"><div class="lesao-editavel" data-id="1" data-nome="Cisto" data-nome-no-mapa="Cisto direito" data-medida1="25" data-medida2="" data-medida3="" data-medida-x="56" data-medida-y="52" data-x="25" data-y="50" data-giro="0" data-tamanho="65" data-eixo-x="100" data-eixo-y="100" data-proporcao="1"></div></div>
  <button data-limpar-mapa>Limpar</button>
  <img data-mapa-manual-teste alt="Montagem manual preservada">
  <p data-estado-regioes hidden></p><p data-estado-final-realista hidden></p>
  <section data-resultado-realista hidden>
    <img data-imagem-original alt="Mapa enviado com rótulos">
    <a data-baixar-montagem-comparacao hidden>Baixar montagem enviada</a>
    <figure data-resultado-gemini-original hidden>
      <img data-imagem-gemini-original alt="Imagem original devolvida pelo Gemini">
      <a data-baixar-gemini-original hidden>Baixar original do Gemini</a>
    </figure>
    <figure data-resultado-regioes hidden><img data-imagem-regioes alt="Outro mapa já montado"><figcaption data-legenda-regioes></figcaption></figure>
    <figure data-resultado-final-realista hidden><img data-imagem-final-realista alt="Proposta para revisão"><a data-baixar-final-realista hidden>Baixar mapa final</a></figure>
  </section>
</div>
<pre id="resultado">PENDENTE</pre>
<script>
window.addEventListener('error', (evento) => {
  const relato = 'Erro de JavaScript: ' + evento.message + ' (' + evento.filename + ':' + evento.lineno + ')';
  document.querySelector('#resultado').textContent = 'FALHOU: ' + relato;
  const cenario = new URLSearchParams(location.search).get('cenario');
  if (cenario) parent.postMessage({ tipo: 'teste-mapa-final', cenario, ok: false, relato }, '*');
});
window.addEventListener('unhandledrejection', (evento) => {
  const relato = 'Promessa rejeitada: ' + (evento.reason?.message || String(evento.reason));
  document.querySelector('#resultado').textContent = 'FALHOU: ' + relato;
  const cenario = new URLSearchParams(location.search).get('cenario');
  if (cenario) parent.postMessage({ tipo: 'teste-mapa-final', cenario, ok: false, relato }, '*');
});
const nomeCenario = new URLSearchParams(location.search).get('cenario');
const cenarios = ['sucesso', 'so_interior', 'jpeg', 'webp', 'clique_duplicado', 'experimento_pendente', 'experimento_depois_sucesso', 'erro', 'bloqueio', 'erro_rede', 'erro_preparo', 'servidor_antigo', 'sem_imagem', 'sem_acabamento', 'bytes_invalidos', 'erro_composicao', 'mascara_invalida', 'inventario_invalido', 'vazio', 'sem_login', 'muda_preparo', 'muda_geracao', 'nova_tentativa', 'sucesso_depois_erro'];
const buscar = (seletor) => document.querySelector(seletor);
const exigir = (condicao, mensagem) => { if (!condicao) throw new Error(mensagem); };
const pausa = (ms) => new Promise((resolver) => setTimeout(resolver, ms));
async function esperar(condicao, mensagem) {
  const limite = Date.now() + 4000;
  while (!condicao()) {
    if (Date.now() >= limite) throw new Error(mensagem);
    await pausa(10);
  }
}

function criarImagem(cor, rotulado = false, formato = 'image/png', sombra = false, altura = 1448) {
  const tela = document.createElement('canvas');
  tela.width = 1086;
  tela.height = altura;
  const contexto = tela.getContext('2d');
  contexto.fillStyle = '#fff';
  contexto.fillRect(0, 0, tela.width, tela.height);
  if (sombra) {
    contexto.strokeStyle = '#a98f81';
    contexto.lineWidth = 16;
    contexto.beginPath();
    contexto.ellipse(272, 724, 65, 48, 0, 0, Math.PI * 2);
    contexto.stroke();
    // Achado inventado pelo provedor: jamais deve entrar no resultado.
    contexto.fillStyle = '#301212';
    contexto.fillRect(690, 490, 30, 100);
  }
  contexto.fillStyle = cor;
  contexto.beginPath();
  contexto.ellipse(272, 724, 65, 48, 0, 0, Math.PI * 2);
  contexto.fill();
  if (rotulado) {
    contexto.fillStyle = '#000';
    contexto.font = '22px Arial';
    contexto.fillText('Cisto direito · 25 mm', 360, 724);
  }
  return tela.toDataURL(formato);
}

function criarMascara() {
  const tela = document.createElement('canvas');
  tela.width = 134;
  tela.height = 100;
  const contexto = tela.getContext('2d');
  contexto.fillStyle = '#fff';
  contexto.beginPath();
  contexto.ellipse(67, 50, 65, 48, 0, 0, Math.PI * 2);
  contexto.fill();
  const rgba = contexto.getImageData(0, 0, tela.width, tela.height).data;
  const alfa = new Uint8ClampedArray(tela.width * tela.height);
  for (let i = 0; i < alfa.length; i++) alfa[i] = rgba[i * 4 + 3];
  return { x: 205, y: 674, largura: tela.width, altura: tela.height, alfa };
}

async function telaDaImagem(fonte) {
  const imagem = await new Promise((resolver, rejeitar) => {
    const recurso = new Image();
    recurso.onload = () => resolver(recurso);
    recurso.onerror = () => rejeitar(new Error('Não foi possível abrir a imagem sintética para conferir os pixels'));
    recurso.src = fonte;
  });
  const tela = document.createElement('canvas');
  tela.width = imagem.naturalWidth;
  tela.height = imagem.naturalHeight;
  tela.getContext('2d').drawImage(imagem, 0, 0);
  return tela;
}

async function adicionarRotulo(fonte) {
  const tela = await telaDaImagem(fonte);
  const contexto = tela.getContext('2d');
  contexto.fillStyle = '#000';
  contexto.font = '22px Arial';
  contexto.fillText('Cisto direito · 25 mm', 360, 724);
  return tela.toDataURL('image/png');
}

const formatoProposta = nomeCenario === 'jpeg' ? 'image/jpeg' : nomeCenario === 'webp' ? 'image/webp' : 'image/png';
const captura = criarImagem('#bc8172');
const proposta = nomeCenario === 'sem_acabamento' ? captura : nomeCenario === 'bytes_invalidos'
  ? 'data:image/png;base64,' + btoa('Isto não contém os bytes de uma imagem PNG.')
  : criarImagem('#56171d', false, formatoProposta, nomeCenario !== 'so_interior', nomeCenario === 'erro_composicao' ? 1086 : 1448);
const capturaRotulada = criarImagem('#bc8172', true);
const outroMapa = criarImagem('#467787', true);
const mascara = criarMascara();
const arredondar = (numero) => Number(numero.toFixed(4));
const inventario = { largura_mapa: 1086, altura_mapa: 1448, lesoes: [{
  id: 'L1', modelo: 'cisto-referencia', x: arredondar(272 * 100 / 1086), y: 50,
  largura: arredondar(130 * 100 / 1086), altura: arredondar(96 * 100 / 1448), giro: 0, recorte: 'alfa',
}] };
const chamadas = { preparacoes: 0, pagas: 0, acabamento: 0, capturas: [], rotulos: [], corpos: [], falhas: [], alternativas: [] };
const seletorDownloads = '[data-baixar-gemini-original], [data-baixar-montagem-comparacao], [data-baixar-final-realista]';
const downloads = () => [...document.querySelectorAll(seletorDownloads)];
function conferirOriginalRemovido() {
  exigir(buscar('[data-resultado-gemini-original]').hidden, 'A resposta anterior do Gemini ficou visível');
  exigir(!buscar('[data-imagem-gemini-original]').getAttribute('src'), 'Conservou os bytes da resposta anterior do Gemini');
  exigir(buscar('[data-baixar-gemini-original]').hidden && !buscar('[data-baixar-gemini-original]').getAttribute('href'), 'Conservou o download da resposta anterior do Gemini');
}
function conferirDownloadsRemovidos() {
  exigir(downloads().every((link) => link.hidden && !link.getAttribute('href') && !link.getAttribute('download')), 'Conservou links de uma comparação anterior');
}
function conferirFinalRemovido() {
  exigir(buscar('[data-resultado-final-realista]').hidden && !buscar('[data-imagem-final-realista]').getAttribute('src'), 'Conservou o resultado final de uma comparação anterior');
}
let experimentoPendente = false;
let concluirExperimento;
buscar('[data-mapa-manual-teste]').src = capturaRotulada;
buscar('[data-imagem-regioes]').src = outroMapa;
exigir(downloads().every((link) => link.hidden && !link.hasAttribute('href')), 'Os links da página precisam começar ocultos e sem endereço');
// Simula uma comparação anterior para provar que uma tentativa aceita a remove.
// Mapa vazio não inicia tentativa e conserva a comparação que já estava aberta.
buscar('[data-imagem-gemini-original]').src = outroMapa;
buscar('[data-resultado-gemini-original]').hidden = false;
for (const link of downloads()) {
  link.href = outroMapa;
  link.download = 'comparacao-anterior.png';
  link.hidden = false;
}
if (nomeCenario && nomeCenario !== 'vazio') {
  buscar('[data-imagem-final-realista]').src = outroMapa;
  buscar('[data-resultado-final-realista]').hidden = false;
}
if (nomeCenario === 'vazio') buscar('.lesao-editavel').remove();
const dadosOriginais = buscar('.lesao-editavel') ? JSON.stringify({ ...buscar('.lesao-editavel').dataset }) : null;

window.endomapaCapturarMapaManual = async (opcoes = {}) => {
  if (experimentoPendente) return opcoes.semLesoes ? captura : outroMapa;
  throw new Error('O fluxo direto usou captura sem a proteção do desenho das lesões');
};
window.endomapaCapturarIntegracaoManual = async (opcoes) => {
  conferirOriginalRemovido();
  conferirDownloadsRemovidos();
  exigir(opcoes?.comInventario === true, 'Não solicitou a lista dinâmica da mesma captura');
  chamadas.capturas.push({ integracao: true });
  return {
    imagem: captura, largura: 1086, altura: 1448,
    inventario: nomeCenario === 'inventario_invalido' ? { ...inventario, lesoes: [] } : structuredClone(inventario),
    lesoes: [{ ...mascara, alfa: nomeCenario === 'mascara_invalida' ? new Uint8ClampedArray(2) : new Uint8ClampedArray(mascara.alfa) }],
  };
};
window.endomapaAdicionarRotulos = async (imagem) => {
  if (experimentoPendente && imagem === outroMapa) return outroMapa;
  chamadas.rotulos.push(imagem);
  if (imagem === captura) return capturaRotulada;
  exigir(imagem !== proposta, 'O aplicativo reaplicou os rótulos diretamente à imagem não protegida do Gemini');
  exigir(imagem.startsWith('data:image/png;base64,'), 'A composição final deve preservar o mapa em PNG');
  return adicionarRotulo(imagem);
};
window.EndomapaAcabamentoAprovado = {
  montar: async () => {
    chamadas.acabamento++;
    if (experimentoPendente) return new Promise((resolver) => { concluirExperimento = resolver; });
    throw new Error('O fluxo direto dependeu do acabamento gratuito');
  },
};
window.ENDOMAPA_SUPABASE = { projectUrl: 'https://mock.supabase.test', publicAnonKey: 'publica' };
window.supabase = { createClient: () => ({ auth: { getSession: async () => ({
  data: { session: nomeCenario === 'sem_login' ? null : { access_token: 'sessao-simulada' } }, error: null,
}) }, functions: { invoke: async (funcao) => {
  chamadas.alternativas.push(funcao);
  throw new Error('O fluxo direto tentou outra chamada ou recuperar uma imagem antiga');
} } }) };
const responder = (dados, status = 200) => new Response(JSON.stringify(dados), {
  status, headers: { 'Content-Type': 'application/json' },
});
window.fetch = async (url, opcoes) => {
  // Não existe alternativa para rede real: toda solicitação é simulada ou falha.
  try {
    exigir(url === 'https://mock.supabase.test/functions/v1/finalizar-mapa-manual-gemini', 'Endereço inesperado; o fluxo direto deve usar somente Gemini');
    exigir(opcoes.method === 'POST', 'Método inesperado');
    exigir(buscar('.editor-manual__area').inert && buscar('[data-limpar-mapa]').disabled, 'Edição manual deve aguardar o fim da geração');
    exigir(opcoes.headers.Authorization === 'Bearer sessao-simulada', 'Login não enviado');
    exigir(buscar('[data-resultado-final-realista]').hidden && !buscar('[data-imagem-final-realista]').getAttribute('src'), 'Uma proposta anterior ficou visível durante a solicitação');
    conferirOriginalRemovido();
    exigir(buscar('[data-baixar-final-realista]').hidden && !buscar('[data-baixar-final-realista]').getAttribute('href'), 'O download do mapa final anterior permaneceu durante a solicitação');
    if (nomeCenario === 'experimento_pendente') buscar('[data-gerar-regioes]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    const corpo = JSON.parse(opcoes.body);
    chamadas.corpos.push(corpo);
    exigir(corpo.modo_edicao_direta === true, 'Não usou edição direta');
    exigir(corpo.versao_integracao === 'refinamento-v2', 'Não informou a versão do refinamento interno');
    exigir(JSON.stringify(corpo.inventario_lesoes) === JSON.stringify(inventario), 'Não enviou a lista dinâmica capturada');
    exigir(JSON.stringify(corpo.lesoes_autorizadas) === '["L1"]', 'Não autorizou automaticamente as lesões da montagem');
    exigir(!JSON.stringify(corpo.inventario_lesoes).includes('Cisto direito'), 'Enviou nome livre no inventário');
    exigir(corpo.composicao_base64 === captura.split(',')[1], 'A imagem enviada difere da montagem capturada');
    exigir(!corpo.modo_mapa_referencia && !corpo.modo_regiao, 'Enviou outro modo de geração');
    exigir(Object.keys(corpo).every((chave) => ['modo_edicao_direta', 'versao_integracao', 'preparar_teste', 'composicao_base64', 'mapa_sha256', 'prompt_sha256', 'inventario_lesoes', 'lesoes_autorizadas'].includes(chave)), 'Enviou referência ou outro parâmetro inesperado ao provedor');
    if (corpo.preparar_teste === true) {
      conferirDownloadsRemovidos();
      chamadas.preparacoes++;
      await pausa(20);
      if (nomeCenario === 'erro_preparo') return responder({ erro: 'Falha simulada na preparação do Gemini' }, 503);
      if (nomeCenario === 'servidor_antigo') return responder({ pronto: true, imagem_1: { sha256: 'hash-mapa-simulado' }, prompt_sha256: 'hash-prompt-simulado' });
      if (nomeCenario === 'muda_preparo') buscar('.lesao-editavel').dataset.x = '60';
      return responder({ pronto: true, versao_integracao: 'refinamento-v2', imagem_1: { sha256: 'hash-mapa-simulado' }, prompt_sha256: 'hash-prompt-simulado' });
    }
    chamadas.pagas++;
    exigir(buscar('[data-imagem-original]').src === capturaRotulada && !buscar('[data-resultado-realista]').hidden, 'A montagem original deve estar disponível antes do envio pago');
    exigir(!buscar('[data-baixar-montagem-comparacao]').hidden && buscar('[data-baixar-montagem-comparacao]').getAttribute('href') === capturaRotulada, 'O download manual deve corresponder à captura enviada, com os rótulos preservados');
    exigir(corpo.mapa_sha256 === 'hash-mapa-simulado' && corpo.prompt_sha256 === 'hash-prompt-simulado', 'Preparação não vinculada à geração');
    await pausa(20);
    if (nomeCenario === 'erro_rede') return Promise.reject(new TypeError('Falha de rede simulada'));
    if (nomeCenario === 'bloqueio') return responder({ erro: 'O Gemini bloqueou esta solicitação.', estado: 'bloqueado_provedor', operacao_id: 'operacao-teste' }, 422);
    if (nomeCenario === 'sem_imagem') return responder({ operacao_id: 'operacao-teste', pedido_id: 'pedido-teste' });
    if (nomeCenario === 'muda_geracao') buscar('.lesao-editavel').dataset.medida1 = '30';
    if (nomeCenario === 'erro' || (nomeCenario === 'nova_tentativa' && chamadas.pagas === 1) || (nomeCenario === 'sucesso_depois_erro' && chamadas.pagas === 2)) {
      return responder({ erro: 'Falha simulada do serviço de imagens', operacao_id: 'operacao-teste', pedido_id: 'pedido-teste' }, 502);
    }
    return responder({ imagem_base64: proposta.split(',')[1], formato: formatoProposta, operacao_id: 'operacao-teste', pedido_id: 'pedido-teste' });
  } catch (erro) {
    chamadas.falhas.push(erro.message);
    throw erro;
  }
};
</script>
<script src="../editor-manual-ia.js"></script>
<script>
async function conferirIntegracaoPreservada() {
  const semRotulos = chamadas.rotulos[chamadas.rotulos.length - 1];
  exigir(semRotulos !== captura && semRotulos !== proposta, 'O resultado deve ser a integração protegida, sem reapresentar a entrada nem copiar a proposta integral');
  const [base, final, gerada] = await Promise.all([telaDaImagem(captura), telaDaImagem(semRotulos), telaDaImagem(proposta)]);
  exigir(final.width === base.width && final.height === base.height, 'A integração mudou as dimensões originais');
  const antes = base.getContext('2d').getImageData(0, 0, base.width, base.height).data;
  const depois = final.getContext('2d').getImageData(0, 0, final.width, final.height).data;
  const esperado = gerada.getContext('2d').getImageData(0, 0, gerada.width, gerada.height).data;
  let alterados = 0, internos = 0;
  for (let y = 0; y < base.height; y++) {
    for (let x = 0; x < base.width; x++) {
      const indice = (y * base.width + x) * 4;
      const mudou = antes[indice] !== depois[indice] || antes[indice + 1] !== depois[indice + 1] || antes[indice + 2] !== depois[indice + 2] || antes[indice + 3] !== depois[indice + 3];
      if (!mudou) continue;
      alterados++;
      const mx = x - mascara.x;
      const my = y - mascara.y;
      if (mx >= 0 && mx < mascara.largura && my >= 0 && my < mascara.altura) {
        const alfa = mascara.alfa[my * mascara.largura + mx];
        if (alfa > 0) internos++;
        if (alfa === 255) for (let canal = 0; canal < 3; canal++) exigir(depois[indice + canal] === esperado[indice + canal], 'Descartou o acabamento recebido no interior autorizado');
      }
      exigir(x >= mascara.x - 4 && x < mascara.x + mascara.largura + 4 && y >= mascara.y - 4 && y < mascara.y + mascara.altura + 4, 'Copiou achado novo ou mudou a anatomia distante da faixa de contato');
    }
  }
  exigir(alterados > 0, 'O fluxo exibiu sucesso sem aplicar acabamento útil');
  exigir(internos > 1000, 'O resultado continuou limitado à sombra externa, sem refinar as lesões');
  exigir(buscar('[data-imagem-final-realista]').src === await adicionarRotulo(semRotulos), 'A imagem protegida não recebeu os nomes e as medidas originais');
}

function conferirOriginalGemini() {
  const link = buscar('[data-baixar-gemini-original]');
  const extensao = { 'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp' }[formatoProposta];
  exigir(!buscar('[data-resultado-realista]').hidden && !buscar('[data-resultado-gemini-original]').hidden, 'A resposta original do Gemini não está disponível para comparação');
  exigir(buscar('[data-imagem-gemini-original]').getAttribute('src') === proposta, 'A imagem original do Gemini foi alterada, redimensionada ou recodificada');
  exigir(!link.hidden && link.getAttribute('href') === proposta, 'O download não preservou os bytes exatos da resposta recebida');
  exigir(link.download.startsWith('endomapa-gemini-original-') && link.download.endsWith(extensao), 'O nome do arquivo original não identifica o conteúdo e seu formato real');
  exigir(buscar('[data-imagem-original]').src === capturaRotulada, 'A comparação perdeu a montagem capturada no momento do envio');
  exigir(buscar('[data-baixar-montagem-comparacao]').getAttribute('href') === capturaRotulada, 'O arquivo manual deixou de corresponder à montagem enviada');
}

function conferirDownloadFinal() {
  const final = buscar('[data-baixar-final-realista]');
  exigir(!final.hidden && final.getAttribute('href') === buscar('[data-imagem-final-realista]').getAttribute('src'), 'O download final não corresponde ao resultado protegido exibido');
  exigir(final.download.startsWith('endomapa-final-') && final.download.endsWith('.png'), 'O download final não identifica o resultado PNG');
}

async function conferirDownloadsSemGeracao() {
  const antes = JSON.stringify({ corpos: chamadas.corpos.length, alternativas: chamadas.alternativas.length, capturas: chamadas.capturas.length });
  for (const link of downloads().filter((item) => !item.hidden)) {
    // Executa os ouvintes do clique, impedindo apenas a gravação real do arquivo.
    link.addEventListener('click', (evento) => evento.preventDefault(), { once: true });
    link.click();
  }
  await pausa(30);
  exigir(JSON.stringify({ corpos: chamadas.corpos.length, alternativas: chamadas.alternativas.length, capturas: chamadas.capturas.length }) === antes, 'Baixar uma imagem iniciou outra captura, solicitação ou geração');
}

async function executarCenario() {
  exigir(cenarios.includes(nomeCenario), 'Cenário desconhecido: ' + nomeCenario);
  const botao = buscar('[data-gerar-final-realista]');
  const estado = buscar('[data-estado-final-realista]');
  exigir(!botao.disabled, 'O botão exigiu uma montagem gratuita anterior');
  const clicar = async (duplicado = false) => {
    botao.click();
    if (duplicado) {
      botao.click();
      // O evento extra também verifica a trava da função, além do botão desabilitado.
      botao.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
    await esperar(() => !botao.disabled && !estado.hidden && estado.textContent.length > 0, 'A operação não terminou ou o botão não foi liberado');
  };
  const conferirSemProposta = () => {
    exigir(buscar('[data-resultado-final-realista]').hidden, 'Exibiu proposta que deveria ter sido descartada');
    exigir(!buscar('[data-imagem-final-realista]').getAttribute('src'), 'Guardou imagem descartada no resultado');
    exigir(estado.classList.contains('mensagem-formulario--erro'), 'Falha sem aviso visível');
    if (nomeCenario !== 'vazio') exigir(buscar('[data-baixar-final-realista]').hidden && !buscar('[data-baixar-final-realista]').getAttribute('href'), 'A falha conservou o download de um resultado final anterior');
  };

  if (nomeCenario === 'experimento_pendente') {
    experimentoPendente = true;
    buscar('[data-gerar-regioes]').click();
    await esperar(() => typeof concluirExperimento === 'function', 'O experimento anterior não ficou pendente');
    conferirOriginalRemovido();
    conferirDownloadsRemovidos();
    conferirFinalRemovido();
    await clicar();
    exigir(estado.textContent.startsWith('Aguarde'), 'O botão não avisou sobre o experimento em andamento');
    exigir(chamadas.corpos.length === 0 && chamadas.capturas.length === 0, 'Gemini iniciou enquanto o experimento ainda podia alterar a comparação');
    concluirExperimento({ imagem: outroMapa, semExemplo: [] });
    await esperar(() => !buscar('[data-gerar-regioes]').disabled, 'O experimento não terminou');
    experimentoPendente = false;
    exigir(buscar('[data-imagem-original]').src === outroMapa, 'O experimento simulado não atualizou a comparação ao terminar');
    conferirOriginalRemovido();
    conferirDownloadsRemovidos();
    await pausa(100);
    exigir(chamadas.corpos.length === 0, 'Gemini iniciou automaticamente após terminar o experimento');
  }
  await clicar(nomeCenario === 'clique_duplicado');
  if (nomeCenario === 'nova_tentativa') {
    conferirSemProposta();
    exigir(chamadas.preparacoes === 1 && chamadas.pagas === 1, 'Primeira tentativa fez chamadas extras');
    await pausa(100);
    exigir(chamadas.pagas === 1, 'Repetiu automaticamente após falha');
    await clicar();
  }
  if (nomeCenario === 'sucesso_depois_erro') {
    exigir(chamadas.preparacoes === 1 && chamadas.pagas === 1, 'O primeiro sucesso fez chamadas extras');
    conferirOriginalGemini();
    conferirDownloadFinal();
    await conferirIntegracaoPreservada();
    await conferirDownloadsSemGeracao();
    await clicar();
    exigir(chamadas.preparacoes === 2 && chamadas.pagas === 2, 'A nova tentativa não corresponde a um único clique explícito');
  }

  if (['sucesso', 'so_interior', 'jpeg', 'webp', 'clique_duplicado', 'experimento_pendente', 'experimento_depois_sucesso', 'nova_tentativa'].includes(nomeCenario)) {
    const total = nomeCenario === 'nova_tentativa' ? 2 : 1;
    exigir(chamadas.preparacoes === total && chamadas.pagas === total, 'Quantidade incorreta de preparações ou gerações');
    exigir(!buscar('[data-resultado-realista]').hidden && !buscar('[data-resultado-final-realista]').hidden, 'Resultado não exibido');
    exigir(buscar('[data-imagem-original]').src === capturaRotulada, 'A comparação não mostra a captura original com rótulos');
    exigir(chamadas.rotulos.includes(captura), 'Faltou reaplicar nomes e medidas à montagem original');
    await conferirIntegracaoPreservada();
    conferirDownloadFinal();
    exigir(!estado.classList.contains('mensagem-formulario--erro'), 'Sucesso apresentado como falha');
    exigir(estado.textContent.includes('Gemini'), 'O resultado não identifica o provedor usado');
  } else {
    conferirSemProposta();
    if (nomeCenario === 'vazio' || nomeCenario === 'sem_login') {
      exigir(chamadas.corpos.length === 0, 'Mapa vazio ou sem login acionou o servidor');
      exigir(chamadas.capturas.length === 0, 'Mapa vazio ou sem login iniciou a captura');
    } else if (['mascara_invalida', 'inventario_invalido'].includes(nomeCenario)) {
      exigir(chamadas.capturas.length === 1, 'A proteção inválida deveria ser detectada na captura');
      exigir(chamadas.preparacoes === 0 && chamadas.pagas === 0, 'Enviou solicitação com a proteção das lesões inválida');
      exigir(/proteção|máscara|lista|inventário/i.test(estado.textContent), 'Não explicou por que a captura foi recusada antes da geração');
    } else if (nomeCenario === 'muda_preparo') {
      exigir(chamadas.preparacoes === 1 && chamadas.pagas === 0, 'Enviou geração paga após mudança no preparo');
      exigir(buscar('.lesao-editavel').dataset.x === '60', 'Desfez a alteração do médico durante o preparo');
    } else if (['erro_preparo', 'servidor_antigo'].includes(nomeCenario)) {
      exigir(chamadas.preparacoes === 1 && chamadas.pagas === 0, 'Enviou geração paga após erro na preparação');
    } else {
      const total = nomeCenario === 'sucesso_depois_erro' ? 2 : 1;
      exigir(chamadas.preparacoes === total && chamadas.pagas === total, 'Quantidade inesperada de chamadas na falha');
      if (nomeCenario === 'muda_geracao') exigir(buscar('.lesao-editavel').dataset.medida1 === '30', 'Desfez a medida alterada pelo médico');
      if (nomeCenario === 'sem_acabamento') {
        exigir(/refinamento/i.test(estado.textContent), 'Não avisou que o Gemini não forneceu refinamento aproveitável');
        exigir(!chamadas.rotulos.some((imagem) => imagem !== captura), 'Preparou um resultado novo sem acabamento aproveitável');
      }
      if (nomeCenario === 'erro_composicao') exigir(/enquadramento/i.test(estado.textContent), 'Não informou por que a resposta válida não pôde ser composta');
    }
  }

  if (['sucesso', 'so_interior', 'jpeg', 'webp', 'clique_duplicado', 'experimento_pendente', 'experimento_depois_sucesso', 'nova_tentativa', 'sem_acabamento', 'erro_composicao', 'muda_geracao'].includes(nomeCenario)) {
    conferirOriginalGemini();
  } else if (nomeCenario === 'vazio') {
    exigir(!buscar('[data-resultado-gemini-original]').hidden && buscar('[data-imagem-gemini-original]').src === outroMapa, 'O aviso de mapa vazio apagou uma comparação sem iniciar tentativa');
    exigir(downloads().every((link) => !link.hidden && link.getAttribute('href') === outroMapa), 'O aviso de mapa vazio apagou os downloads de uma comparação anterior');
  } else {
    conferirOriginalRemovido();
  }
  if (nomeCenario !== 'vazio') {
    const manual = buscar('[data-baixar-montagem-comparacao]');
    if (chamadas.pagas > 0) {
      exigir(!manual.hidden && manual.getAttribute('href') === capturaRotulada && manual.download.endsWith('.png'), 'Perdeu a montagem enviada depois da resposta ou falha');
    } else {
      conferirDownloadsRemovidos();
    }
  }
  await conferirDownloadsSemGeracao();
  if (nomeCenario === 'experimento_depois_sucesso') {
    experimentoPendente = true;
    buscar('[data-gerar-regioes]').click();
    await esperar(() => typeof concluirExperimento === 'function', 'O experimento não iniciou após a comparação concluída');
    conferirOriginalRemovido();
    conferirDownloadsRemovidos();
    conferirFinalRemovido();
    concluirExperimento({ imagem: outroMapa, semExemplo: [] });
    await esperar(() => !buscar('[data-gerar-regioes]').disabled, 'O experimento após o sucesso não terminou');
    experimentoPendente = false;
    exigir(buscar('[data-imagem-original]').src === outroMapa, 'O experimento não atualizou a montagem da comparação');
    conferirOriginalRemovido();
    conferirDownloadsRemovidos();
    conferirFinalRemovido();
    exigir(chamadas.preparacoes === 1 && chamadas.pagas === 1, 'O experimento repetiu a geração direta');
  }
  const totalChamadas = chamadas.corpos.length;
  await pausa(100);
  exigir(chamadas.corpos.length === totalChamadas, 'Houve repetição automática');
  exigir(chamadas.falhas.length === 0, chamadas.falhas.join('; '));
  exigir(chamadas.alternativas.length === 0, 'Tentou outra chamada, provedor ou recuperar resultado antigo');
  exigir(chamadas.acabamento === (['experimento_pendente', 'experimento_depois_sucesso'].includes(nomeCenario) ? 1 : 0), 'Iniciou acabamento durante o fluxo direto');
  exigir(buscar('[data-mapa-manual-teste]').src === capturaRotulada, 'Substituiu o mapa manual');
  exigir(buscar('[data-imagem-regioes]').src === outroMapa, 'Substituiu outro resultado já montado');
  if (dadosOriginais && !nomeCenario.startsWith('muda_')) {
    exigir(JSON.stringify({ ...buscar('.lesao-editavel').dataset }) === dadosOriginais, 'Alterou os dados das lesões');
  }
  exigir(!botao.disabled, 'O botão não ficou disponível para uma nova ação explícita');
  if (nomeCenario !== 'vazio') exigir(botao.textContent === 'Gerar mapa realista com Gemini · pago', 'O botão não informa o provedor e o custo');
  exigir(!estado.textContent.includes('OpenAI'), 'A mensagem do fluxo principal atribui a resposta ao provedor anterior');
  exigir(!buscar('.editor-manual__area').inert && !buscar('[data-limpar-mapa]').disabled, 'Edição manual não foi liberada ao terminar');
  return nomeCenario + ': ' + chamadas.preparacoes + ' preparação(ões), ' + chamadas.pagas + ' geração(ões) simulada(s)';
}

async function executarTodos() {
  buscar('#cenario').hidden = true;
  const resultados = [];
  for (const nome of cenarios) {
    const quadro = document.createElement('iframe');
    quadro.hidden = true;
    const resposta = new Promise((resolver, rejeitar) => {
      const receber = (evento) => {
        if (evento.source !== quadro.contentWindow || evento.data?.tipo !== 'teste-mapa-final' || evento.data.cenario !== nome) return;
        clearTimeout(prazo);
        window.removeEventListener('message', receber);
        evento.data.ok ? resolver(evento.data.relato) : rejeitar(new Error(evento.data.relato));
      };
      const prazo = setTimeout(() => {
        window.removeEventListener('message', receber);
        const documento = quadro.contentDocument;
        const detalhe = documento ? JSON.stringify({
          carregamento: documento.readyState,
          resultado: documento.querySelector('#resultado')?.textContent,
          estado: documento.querySelector('[data-estado-final-realista]')?.textContent,
        }) : 'Documento indisponível';
        rejeitar(new Error('O cenário não respondeu: ' + nome + ' / ' + detalhe));
      }, 6000);
      window.addEventListener('message', receber);
    });
    quadro.src = location.pathname + '?cenario=' + nome;
    document.body.append(quadro);
    try { resultados.push(await resposta); } finally { quadro.remove(); }
    buscar('#resultado').textContent = 'EXECUTANDO\n' + resultados.join('\n');
  }
  return resultados.length + ' cenários; nenhuma chamada externa real.\n' + resultados.join('\n');
}

window.addEventListener('load', async () => {
  try {
    const relato = nomeCenario ? await executarCenario() : await executarTodos();
    buscar('#resultado').textContent = 'PASSOU: ' + relato;
    if (nomeCenario) parent.postMessage({ tipo: 'teste-mapa-final', cenario: nomeCenario, ok: true, relato }, '*');
  } catch (erro) {
    const relato = (nomeCenario ? nomeCenario + ': ' : '') + erro.message + ' / ' + buscar('[data-estado-final-realista]').textContent;
    buscar('#resultado').textContent = 'FALHOU: ' + relato;
    if (nomeCenario) parent.postMessage({ tipo: 'teste-mapa-final', cenario: nomeCenario, ok: false, relato }, '*');
  }
});
</script>
