<!doctype html><meta charset="utf-8"><pre id="resultado">Executando...</pre><iframe src="previa.html" style="width:390px;height:1500px"></iframe><script>

click('[data-tuba-lado="direita"]');ok(ativo(estado().direita)&&!ativo(estado().esquerda),'Direita saindo de ambas '+tipo);
click('[data-tuba-lado="esquerda"]');ok(ativo(estado().esquerda)&&!ativo(estado().direita),'Somente esquerda '+tipo);const ajustado=structuredClone(estado().esquerda);
click('[data-tuba-lado="direita"]');ok(ativo(estado().direita)&&!ativo(estado().esquerda),'Transfere direita '+tipo);
click('[data-tuba-lado="ambos"]');ok(ativo(estado().direita)&&ativo(estado().esquerda),'Ambas '+tipo);ok(p.querySelector('[data-tuba-acao="'+tipo+'"]').getAttribute('aria-pressed')==='true','Mantém seleção');
if(tipo==='hidro')ok(estado().esquerda.inicio===ajustado.inicio,'Preserva extensão');
const salva=ed.capturar();ed.restaurar(salva);await wait();ok(JSON.stringify(ed.capturar())===JSON.stringify(salva),'Restauração '+tipo);

r.textContent='PASSOU: troca imediata esquerda/direita/ambas em hidrosalpinge, espessamento, obstrução e salpingectomia; extensão, seleção, outras lesões e restauração preservadas.';
}catch(e){r.textContent='FALHOU: '+e.stack}};
</script>
