<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Verificação de nomes no editor</title>
<pre id="resultado">Executando</pre>
<iframe title="Editor manual sem serviços externos" style="width:420px;height:900px"></iframe>
<script>
// Reutiliza a mesma cópia local do aplicativo, sem autenticação nem serviços de IA.
const quadro = document.querySelector('iframe');
const temporizador = setTimeout(() => {
  document.querySelector('#resultado').textContent = 'FALHOU: o teste do editor não terminou.';
}, 25000);
window.addEventListener('message', (evento) => {
  if (evento.source !== quadro.contentWindow || evento.origin !== location.origin || evento.data?.teste !== 'editor-manual-nomes') return;
  clearTimeout(temporizador);
  document.querySelector('#resultado').textContent = evento.data.resultado;
});
quadro.src = 'editor-manual-integrado.html?caso=nomes';
</script>
</html>
