<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Textos e cabeçalho</title>
<pre id="resultado">Executando</pre><iframe style="width:390px;height:844px;border:0" title="Editor no celular"></iframe>
<script>
(async () => {
 const resultado = document.querySelector('pre');
 const verificar = (ok, erro) => { if (!ok) throw new Error(erro); };
 try {
  const html = new DOMParser().parseFromString(await (await fetch('../app.html')).text(), 'text/html');
  html.querySelectorAll('script').forEach(s => s.remove()); html.body.classList.remove('autenticacao-pendente');
  const base = html.createElement('base'); base.href = new URL('../', location.href); html.head.prepend(base);
  for (const src of ['prototipo.js','assets/vendor/jspdf-4.2.1.umd.min.js','pdf-manual.js','editor-documento.js','editor-manual.js']) { const s = html.createElement('script'); s.src = src; html.body.append(s); }
  const iframe = document.querySelector('iframe'); const pronto = new Promise(r => iframe.onload = r); iframe.srcdoc = html.documentElement.outerHTML; await pronto;
  const w = iframe.contentWindow, d = w.document, editor = w.endomapaEditorManual;
  const esperar = async funcao => { for (let i = 0; i < 500; i++) { if (funcao()) return; await new Promise(r => setTimeout(r, 20)); } throw new Error('Tempo excedido'); };
  const downloads = []; w.HTMLAnchorElement.prototype.click = function () { downloads.push(this.download); };
  d.querySelector('[data-tela-alvo="editor-manual"]').click();
  verificar(editor, 'Editor não inicializou'); const vazio = editor.capturar();
  verificar(vazio.documento.cabecalho.ativo === false, 'Cabeçalho deve começar desativado');
  const barra = d.querySelector('[data-textos-vista="coronal"]');
  barra.querySelector('[data-adicionar-texto]').click();
  const campo = barra.querySelector('textarea'); campo.value = 'Observação livre\nSem lesão inserida'; campo.dispatchEvent(new w.Event('input'));
  verificar(barra.parentElement === d.querySelector('[data-controles-lesao]').parentElement, 'Texto deve ficar no painel de ajustes');
  verificar(Boolean(barra.compareDocumentPosition(d.querySelector('[data-controles-lesao]')) & w.Node.DOCUMENT_POSITION_FOLLOWING), 'Botão deve vir antes de Ajustar lesão');
  const nota = d.querySelector('.documento-texto'); nota.setPointerCapture = () => verificar(nota.isConnected, 'Arrastar deve preservar a caixa selecionada');
  nota.dispatchEvent(new w.PointerEvent('pointerdown', {bubbles:true, pointerId:1, clientX:100, clientY:100}));
  nota.dispatchEvent(new w.PointerEvent('pointermove', {pointerId:1, clientX:3000, clientY:110}));
  nota.dispatchEvent(new w.PointerEvent('pointerup', {pointerId:1}));
  verificar(editor.capturar().documento.textos.coronal[0].x > 5, 'Arraste deve mover o texto');
  verificar(editor.capturar().documento.textos.coronal[0].x > 60, 'Texto curto deve ultrapassar o antigo limite');
  verificar(Math.abs(nota.getBoundingClientRect().right - nota.parentElement.getBoundingClientRect().right) < 2, 'Caixa deve alcançar a borda direita sem ultrapassar');
  const posicaoArrastada = editor.capturar().documento.textos.coronal[0].x;
  verificar(!barra.querySelector('input[type="range"]'), 'Posicionamento deve ocorrer somente por arraste');
  const painel = d.querySelector('.documento-opcoes'); painel.open = true;
  painel.querySelector('[data-novo-campo]').click();
  const inputs = painel.querySelectorAll('.documento-campo input');
  inputs[0].value = 'Paciente'; inputs[1].value = 'Paciente fictícia de teste'; inputs.forEach(i => i.dispatchEvent(new w.Event('input')));
  for (const [nome, valor] of [['Data de nascimento','01/01/1990'],['Pedido','12345'],['Solicitante','Médico de teste'],['Data do exame','12/10/2026'],['Convênio','Particular']]) {
    painel.querySelector('[data-novo-campo]').click(); const camposNovos = painel.querySelector('.documento-campo:last-child').querySelectorAll('input');
    camposNovos[0].value = nome; camposNovos[1].value = valor; camposNovos.forEach(i => i.dispatchEvent(new w.Event('input')));
  }
  painel.querySelector('[data-cabecalho-ativo]').click();
  const salvo = editor.capturar();
  verificar(salvo.vistas.coronal.lesoes.length === 0 && salvo.documento.textos.coronal.length === 1, 'Texto deve ser independente');
  verificar(salvo.documento.textos.sagital.length === 0 && salvo.documento.textos.coronal[0].x === posicaoArrastada, 'Posição e vistas');
  const imagem = async () => { const img = new w.Image(); const fonte = await w.endomapaCapturarMapaManual({formato:'image/png'}); await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = fonte; }); return img; };
  const com = await imagem(); verificar(com.height > 1448, 'Cabeçalho deve acrescentar espaço sem cobrir anatomia');
  painel.querySelector('[data-cabecalho-ativo]').click(); const sem = await imagem(); verificar(sem.height === 1448, 'Desativar deve remover espaço do cabeçalho');
  editor.restaurar(salvo); verificar(JSON.stringify(editor.capturar().documento) === JSON.stringify(salvo.documento), 'Reabrir deve preservar textos e cabeçalho');
  const jpeg = await w.endomapaCapturarMapaManual({formato:'image/jpeg', fundoBranco:true}); verificar(jpeg.startsWith('data:image/jpeg'), 'JPEG deve funcionar com documento');
  let paginasPdf, arquivoPdf; const gerar = w.endomapaGerarPdfA4;
  w.endomapaGerarPdfA4 = paginas => { paginasPdf = paginas; arquivoPdf = gerar(paginas); return arquivoPdf; };
  d.querySelector('input[name="vistas-editor"][value="ambas"]').click();
  d.querySelector('[data-baixar-pdf-manual]').click();
  campo.value = 'Edição depois do clique'; campo.dispatchEvent(new w.Event('input'));
  await esperar(() => downloads.length > 0);
  verificar(paginasPdf.length === 2 && paginasPdf.every(p => p.canvas.height > d.querySelector(`[data-mapa-editor="${p.vista}"] [data-mapa-base]`).naturalHeight), 'PDF deve incluir cabeçalho nas duas vistas: ' + paginasPdf.map(p => p.vista + ':' + p.canvas.width + 'x' + p.canvas.height).join(',') + ' esperado ' + com.height);
  verificar(paginasPdf[0].canvas.toDataURL() === com.src, 'PDF deve preservar captura de texto e cabeçalho do instante do clique');
  verificar(arquivoPdf.size > 1000, 'PDF real deve ser gerado');
  editor.restaurar(salvo);
  const invalido = JSON.parse(JSON.stringify(salvo)); invalido.documento.textos.coronal[0].x = -10;
  let recusado = false; try { editor.restaurar(invalido); } catch { recusado = true; }
  verificar(recusado && JSON.stringify(editor.capturar().documento) === JSON.stringify(salvo.documento), 'Dados inválidos devem preservar mapa');
  verificar(d.documentElement.scrollWidth <= 390, 'Não deve transbordar em celular');
  d.querySelector('[data-limpar-mapa]').click(); verificar(editor.capturar().documento.textos.coronal.length === 0, 'Limpar vista deve retirar textos');
  editor.restaurar(salvo); const antigo = JSON.parse(JSON.stringify(vazio)); delete antigo.documento; editor.restaurar(antigo);
  verificar(editor.capturar().documento.textos.coronal.length === 0 && !editor.capturar().documento.cabecalho.ativo, 'Montagens antigas devem abrir sem dados residuais');
  editor.restaurar(salvo); d.querySelector('[data-modelo]').click();
  for (const largura of [390, 1280]) {
    iframe.style.width = largura + 'px'; await new Promise(r => setTimeout(r, 100));
    const botaoTexto = barra.querySelector('[data-adicionar-texto]').getBoundingClientRect();
    const ajuste = d.querySelector('[data-controles-lesao]').getBoundingClientRect();
    verificar(botaoTexto.height > 0 && botaoTexto.bottom <= ajuste.top, 'Botão acima de Ajustar lesão em ' + largura);
    verificar(d.documentElement.scrollWidth <= largura, 'Painel sem transbordamento em ' + largura);
    const caixa = d.querySelector('.documento-texto');
    verificar(caixa.getBoundingClientRect().right <= caixa.parentElement.getBoundingClientRect().right + 2, 'Texto dentro do mapa em ' + largura);
  }
  iframe.style.width = '390px'; await new Promise(r => setTimeout(r, 100));
  editor.restaurar(salvo); d.querySelector('[data-mapa-editor="coronal"]').scrollIntoView({block:'center'});
  resultado.textContent = 'PASSOU: texto sem lesão, edição, posição, vistas independentes, cabeçalho opcional, PNG/JPEG/PDF, captura imutável, restauração, compatibilidade, validação e celular.';
 } catch (e) { resultado.textContent = 'FALHOU: ' + e.message; }
})();
</script></html>
