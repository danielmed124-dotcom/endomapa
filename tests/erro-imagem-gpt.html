<!doctype html>
<meta charset="utf-8">
<title>Diagnóstico de bloqueios de imagem</title>
<pre id="resultado">PENDENTE</pre>
<script type="module">
import { diagnosticarErroImagem } from '../supabase/functions/_shared/erro-imagem-gpt.js';
const conferir = (condicao, mensagem) => { if (!condicao) throw new Error(mensagem); };
try {
  const relatado = diagnosticarErroImagem({error:{message:'Your request was rejected by the safety system. Include request ID req_eb07e81d19204b3fab6455cfa7aa6ae9.'}}, null);
  conferir(relatado.codigo === 'GPT_SEGURANCA' && relatado.pedido_id === 'req_eb07e81d19204b3fab6455cfa7aa6ae9', 'Erro relatado não reconhecido');
  conferir(relatado.etapa === 'unknown' && relatado.categorias.length === 0, 'Diagnóstico inventado');
  const entrada = diagnosticarErroImagem({error:{code:'moderation_blocked',moderation_details:{moderation_stage:'input',categories:['sexual','sexual','desconhecida']}}}, 'req_teste');
  conferir(entrada.etapa === 'input' && entrada.categorias.length === 1 && entrada.erro.includes('conteúdo sexual'), 'Diagnóstico da entrada');
  const saida = diagnosticarErroImagem({error:{code:'moderation_blocked',moderation_details:{moderation_stage:'output',categories:['violence']}}}, 'req_saida');
  conferir(saida.erro.includes('imagem produzida'), 'Diagnóstico da saída');
  const malformado = diagnosticarErroImagem({error:{code:'content_policy_violation',moderation_details:{moderation_stage:'__proto__',categories:[null,{},'__proto__']}}}, 'valor inválido');
  conferir(malformado.etapa === 'unknown' && malformado.categorias.length === 0 && malformado.pedido_id === null, 'Resposta malformada');
  conferir(diagnosticarErroImagem(null, null) === null, 'Resposta vazia');
  conferir(diagnosticarErroImagem({error:{code:'rate_limit_exceeded',message:'Limite'}}, 'req_limite') === null, 'Erro de limite confundido com segurança');
  document.querySelector('#resultado').textContent = 'PASSOU: erro relatado, identificador, entrada, saída, categorias, campos ausentes, resposta malformada e distinção de limites.';
} catch (erro) {
  document.querySelector('#resultado').textContent = 'FALHOU: ' + erro.message;
}
</script>
