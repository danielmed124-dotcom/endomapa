<!doctype html>
<meta charset="utf-8">
<title>Verificação da área de integração</title>
<pre id="resultado">Executando</pre>
<iframe src="../experimento-editor.html" style="width:390px;height:844px"></iframe>
<script type="module">
import { prepararEdicaoGPT } from '../supabase/functions/_shared/mascara-imagem-gpt.js';
const frame = document.querySelector('iframe');
try {
  const limite = Date.now() + 15000;
  while (typeof frame.contentWindow?.endomapaCapturarMapaManual !== 'function' && Date.now() < limite) {
    await new Promise(resolve => setTimeout(resolve, 50));
  }
  if (typeof frame.contentWindow?.endomapaCapturarMapaManual !== 'function') throw new Error('O editor não iniciou no teste local');
  const win = frame.contentWindow, doc = win.document;
  const verificar = (ok, texto) => { if (!ok) throw new Error(texto); };
  doc.querySelector('[data-nome="Endometrioma"]').click();
  const lesao = doc.querySelector('.lesao-editavel');
  Object.assign(lesao.dataset, { x: '50', y: '50', giro: '90', tamanho: '100', eixoX: '200', eixoY: '100', proporcao: '1' });
  const captura = await win.endomapaCapturarMapaManual({ integracao: true });
  const img = new Image(); img.src = captura.mascara; await img.decode();
  const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
  const alpha = (x, y) => ctx.getImageData(x, y, 1, 1).data[3];
  verificar(alpha(543, 724) === 0, 'Centro da lesão deve ser editável');
  verificar(alpha(543, 870) === 0, 'Rotação, escala e faixa adjacente devem entrar na área');
  verificar(alpha(700, 724) === 255 && alpha(5, 5) === 255, 'Fora da área deve permanecer protegido');
  const edicao = prepararEdicaoGPT(captura.composicao.split(',')[1], captura.mascara.split(',')[1]);
  verificar(edicao.tipo === 'image/png' && edicao.mascara.length > 0, 'Servidor deve aceitar os PNGs reais');
  let recusas = 0;
  const pequena = document.createElement('canvas'); pequena.width = 16; pequena.height = 16;
  for (const mascara of ['invalida', pequena.toDataURL().split(',')[1]]) {
    try { prepararEdicaoGPT(captura.composicao.split(',')[1], mascara); } catch (_) { recusas++; }
  }
  verificar(recusas === 2, 'Rejeitar dados inválidos e dimensões incompatíveis');
  verificar(typeof await win.endomapaCapturarMapaManual() === 'string', 'Captura anterior deve continuar funcionando');
  doc.querySelector('[data-nome="DIU de Cobre"]').click();
  const diu = [...doc.querySelectorAll('.lesao-editavel')].at(-1);
  Object.assign(diu.dataset, { x: '50', y: '50' });
  const protegida = await win.endomapaCapturarMapaManual({ integracao: true });
  img.src = protegida.mascara; await img.decode(); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0);
  verificar(alpha(543, 724) === 255, 'DIU sobreposto deve permanecer protegido');
  lesao.remove();
  let bloqueado = false;
  try { await win.endomapaCapturarMapaManual({ integracao: true }); } catch (_) { bloqueado = true; }
  verificar(bloqueado, 'Somente DIU não deve iniciar edição');
  document.querySelector('#resultado').textContent = 'PASSOU: área, rotação, escala, tecido adjacente, DIU, PNGs, validação e compatibilidade. Sem chamada de geração.';
} catch (erro) { document.querySelector('#resultado').textContent = 'FALHOU: ' + erro.message; }
</script>
