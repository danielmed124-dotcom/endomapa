<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Endomapa transforma achados de exames em mapas anatômicos profissionais para médicos radiologistas."
    />
    <title>Endomapa | Mapas anatômicos profissionais</title>
    <style>
      :root {
        color-scheme: dark;
        --fundo: #0c100e;
        --superficie: #141a16;
        --texto: #f5f2e9;
        --texto-suave: #b9c0b9;
        --verde-musgo: #6f7f52;
        --verde-claro: #a9b78b;
        --dourado: #c9a24d;
        --borda: rgba(201, 162, 77, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--fundo);
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        color: var(--texto);
        background:
          radial-gradient(circle at 50% 15%, rgba(111, 127, 82, 0.2), transparent 38%),
          var(--fundo);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 28px 20px;
      }

      .apresentacao {
        width: min(100%, 760px);
        padding: 40px 22px;
        text-align: center;
        background: linear-gradient(145deg, rgba(20, 26, 22, 0.94), rgba(12, 16, 14, 0.96));
        border: 1px solid var(--borda);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }

      .marca {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 38px;
        color: var(--dourado);
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .marca::before {
        width: 11px;
        height: 11px;
        content: "";
        background: var(--verde-musgo);
        border: 2px solid var(--dourado);
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(111, 127, 82, 0.16);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 15vw, 5.8rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      h1 span {
        color: var(--verde-claro);
      }

      .promessa {
        max-width: 620px;
        margin: 26px auto 0;
        color: var(--texto);
        font-size: clamp(1.2rem, 5.7vw, 1.75rem);
        font-weight: 520;
        line-height: 1.32;
        text-wrap: balance;
      }

      .promessa strong {
        color: var(--dourado);
        font-weight: 650;
      }

      .detalhe {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 32px 0 0;
        color: var(--texto-suave);
        font-size: 0.93rem;
        line-height: 1.5;
      }

      .detalhe::before,
      .detalhe::after {
        width: 28px;
        height: 1px;
        flex: 0 0 auto;
        content: "";
        background: var(--dourado);
        opacity: 0.58;
      }

      @media (min-width: 600px) {
        main {
          padding: 40px;
        }

        .apresentacao {
          padding: 64px 48px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="apresentacao" aria-labelledby="titulo">
        <div class="marca">Mapeamento pélvico</div>
        <h1 id="titulo">Endo<span>mapa</span></h1>
        <p class="promessa">
          Transforme achados radiológicos em mapas anatômicos profissionais, prontos para impressão em
          <strong>até 60 segundos.</strong>
        </p>
        <p class="detalhe">Criado para médicos radiologistas</p>
      </section>
    </main>
  </body>
</html>
